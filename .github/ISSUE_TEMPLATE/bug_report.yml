name: Bug report
description: Something SEO Desk got wrong or crashed on
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      description: What you ran (leave out keys and private URLs)
      placeholder: seodesk audit example.com --format json
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `seodesk --version`, and your OS and Python version
      placeholder: seodesk 0.1.0, macOS 15, Python 3.12
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report or log
      description: The relevant part of the JSON report (`--format json`) or the error
      render: text
