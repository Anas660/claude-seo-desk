[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-desk"
dynamic = ["version"]
description = "Is your site ready for AI search? SEO, AEO and GEO audits from the CLI, CI, Claude Code or MCP: AI crawler access, llms.txt, answer-ready pages, AI visibility tracking, and an AI analyst that writes the to-do list."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syed Anas" }]
requires-python = ">=3.9"
keywords = ["seo", "aeo", "geo", "generative-engine-optimization", "answer-engine-optimization", "llms-txt", "ai-crawlers",
            "robots-txt", "seo-audit", "ai-visibility", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3; python_version >= '3.10'"]
dev = ["pytest>=8.0", "mcp>=2,<3; python_version >= '3.10'"]

[project.scripts]
seodesk = "seodesk.__main__:main"
seo-desk = "seodesk.__main__:main"  # so `uvx seo-desk audit example.com` works

[project.urls]
Homepage = "https://github.com/Anas660/claude-seo-desk"
Issues = "https://github.com/Anas660/claude-seo-desk/issues"
Changelog = "https://github.com/Anas660/claude-seo-desk/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "seodesk.__version__" }

[tool.setuptools.packages.find]
include = ["seodesk*"]

[tool.setuptools.package-data]
seodesk = ["templates/*", "dashboard/static/*.html", "dashboard/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
filterwarnings = ["ignore::DeprecationWarning"]
